name: PyPI Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    env:
      UV_PYTHON: "3.11"
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false

      - name: Install build dependencies
        run: uv sync --all-extras --dev --python 3.11

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          RELEASE_TAG="${RELEASE_TAG:-${GITHUB_REF_NAME}}"
          VERSION="$(uv run python -c 'import percolation_inversion_compiler as p; print(p.__version__)')"
          test "${RELEASE_TAG}" = "v${VERSION}"

      - name: Build distributions
        run: uv build

      - name: Validate distribution metadata and artifacts
        run: uv run python scripts/check_distribution_artifacts.py

      - name: Publish distributions to PyPI
        run: uv publish --trusted-publishing always dist/*
